<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Painel do Técnico - Acesso Remoto</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --accent: #4f8cff;
    --accent-hover: #3f78e0;
    --text: #e6e8ec;
    --muted: #8a8f98;
    --danger: #ff5f5f;
    --success: #3ecf8e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    background: var(--panel);
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid #262a33;
  }
  header h1 { font-size: 16px; margin: 0; color: var(--text); font-weight: 600; }
  #connect-form { display: flex; gap: 8px; margin-left: auto; }
  input[type="text"] {
    background: #0f1115;
    border: 1px solid #2c313c;
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
    width: 180px;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { background: #3a3f4a; cursor: not-allowed; }
  #status {
    font-size: 13px;
    color: var(--muted);
    padding: 6px 20px;
  }
  #status.error { color: var(--danger); }
  #status.success { color: var(--success); }
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #05060a;
    position: relative;
    overflow: hidden;
  }
  #remoteVideo {
    max-width: 100%;
    max-height: 100%;
    cursor: crosshair;
    display: none;
  }
  #placeholder {
    color: var(--muted);
    text-align: center;
    font-size: 14px;
  }
  #placeholder svg { opacity: 0.3; margin-bottom: 12px; }
</style>
</head>
<body>

<header>
  <h1>🖥️ Painel do Técnico</h1>
  <form id="connect-form">
    <input type="text" id="targetId" placeholder="ID da máquina (ex: 123456789)" maxlength="9" />
    <button type="submit" id="connectBtn">Conectar</button>
    <button type="button" id="disconnectBtn" style="display:none; background:var(--danger)">Encerrar</button>
  </form>
</header>

<div id="status">Desconectado do servidor de sinalização.</div>

<main>
  <video id="remoteVideo" autoplay playsinline></video>
  <div id="placeholder">
    <div>Digite o ID da máquina do cliente para iniciar o acesso remoto</div>
  </div>
</main>

<script>
const SIGNALING_SERVER_URL = "ws://localhost:8080"; // troque pelo endereço do seu servidor (wss:// em produção)

const statusEl = document.getElementById('status');
const form = document.getElementById('connect-form');
const targetIdInput = document.getElementById('targetId');
const connectBtn = document.getElementById('connectBtn');
const disconnectBtn = document.getElementById('disconnectBtn');
const video = document.getElementById('remoteVideo');
const placeholder = document.getElementById('placeholder');

let ws = null;
let pc = null;
let dataChannel = null;
let currentTargetId = null;

function setStatus(text, kind) {
  statusEl.textContent = text;
  statusEl.className = kind || '';
}

function connectSignaling() {
  ws = new WebSocket(SIGNALING_SERVER_URL);

  ws.onopen = () => setStatus('Conectado ao servidor de sinalização. Pronto para conectar.', 'success');
  ws.onclose = () => setStatus('Desconectado do servidor de sinalização.', 'error');
  ws.onerror = () => setStatus('Erro ao conectar no servidor de sinalização.', 'error');

  ws.onmessage = async (event) => {
    const msg = JSON.parse(event.data);

    switch (msg.type) {
      case 'error':
        setStatus(msg.message, 'error');
        connectBtn.disabled = false;
        break;

      case 'request-declined':
        setStatus('O cliente recusou o acesso.', 'error');
        connectBtn.disabled = false;
        break;

      case 'request-accepted':
        setStatus('Acesso aceito! Estabelecendo conexão...', 'success');
        await startWebRTC(msg.targetId);
        break;

      case 'signal':
        await handleSignal(msg.payload);
        break;

      case 'session-ended':
        setStatus('A sessão foi encerrada.', 'error');
        teardown();
        break;
    }
  };
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const id = targetIdInput.value.trim();
  if (!id) return;
  currentTargetId = id;
  connectBtn.disabled = true;
  setStatus(`Solicitando acesso à máquina ${id}... aguardando o cliente aceitar.`);
  ws.send(JSON.stringify({ type: 'request-connect', targetId: id, technicianName: 'Suporte Técnico' }));
});

disconnectBtn.addEventListener('click', () => {
  ws.send(JSON.stringify({ type: 'end-session', targetId: currentTargetId }));
  teardown();
});

async function startWebRTC(targetId) {
  pc = new RTCPeerConnection({
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' }
      // Adicione aqui um servidor TURN para redes mais restritivas, ex:
      // { urls: 'turn:seu-turn-server.com:3478', username: '...', credential: '...' }
    ]
  });

  pc.ontrack = (event) => {
    video.srcObject = event.streams[0];
    video.style.display = 'block';
    placeholder.style.display = 'none';
    disconnectBtn.style.display = 'inline-block';
  };

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      ws.send(JSON.stringify({
        type: 'signal',
        targetId,
        payload: { kind: 'ice-candidate', candidate: event.candidate }
      }));
    }
  };

  // canal de dados: usado para enviar comandos de mouse/teclado ao agente
  dataChannel = pc.createDataChannel('control');
  setupControlEvents();

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  ws.send(JSON.stringify({
    type: 'signal',
    targetId,
    payload: { kind: 'offer', sdp: offer }
  }));
}

async function handleSignal(payload) {
  if (!pc) return;
  if (payload.kind === 'answer') {
    await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
  } else if (payload.kind === 'ice-candidate' && payload.candidate) {
    try { await pc.addIceCandidate(payload.candidate); } catch (e) { console.warn(e); }
  }
}

function setupControlEvents() {
  // Envia posição do mouse (normalizada 0-1 para funcionar em qualquer resolução)
  video.addEventListener('mousemove', (e) => sendControl({ type: 'mousemove', x: relX(e), y: relY(e) }));
  video.addEventListener('mousedown', (e) => sendControl({ type: 'mousedown', button: e.button, x: relX(e), y: relY(e) }));
  video.addEventListener('mouseup',   (e) => sendControl({ type: 'mouseup', button: e.button, x: relX(e), y: relY(e) }));
  video.addEventListener('wheel', (e) => { sendControl({ type: 'scroll', deltaY: e.deltaY }); e.preventDefault(); }, { passive: false });
  video.addEventListener('contextmenu', (e) => e.preventDefault());

  window.addEventListener('keydown', (e) => {
    if (document.activeElement === targetIdInput) return;
    sendControl({ type: 'keydown', key: e.key, code: e.code });
    e.preventDefault();
  });
  window.addEventListener('keyup', (e) => {
    if (document.activeElement === targetIdInput) return;
    sendControl({ type: 'keyup', key: e.key, code: e.code });
    e.preventDefault();
  });
}

function relX(e) { return e.offsetX / video.clientWidth; }
function relY(e) { return e.offsetY / video.clientHeight; }

function sendControl(data) {
  if (dataChannel && dataChannel.readyState === 'open') {
    dataChannel.send(JSON.stringify(data));
  }
}

function teardown() {
  if (pc) { pc.close(); pc = null; }
  video.srcObject = null;
  video.style.display = 'none';
  placeholder.style.display = 'block';
  connectBtn.disabled = false;
  disconnectBtn.style.display = 'none';
}

connectSignaling();
</script>
</body>
</html>
